# Local Postgres for development. Port 5433 so it does not clash with other local Postgres servers.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mywear
      POSTGRES_PASSWORD: mywear
      POSTGRES_DB: mywear
    ports:
      - '5433:5432'
    volumes:
      - mywear-db:/var/lib/postgresql/data
volumes:
  mywear-db:
